<!DOCTYPE html>
<html lang="fr" data-theme="pduf">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototypes — Atelier PDF</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23CB1617'/><text x='16' y='21' font-family='Georgia,serif' font-size='13' font-weight='900' fill='%23FBF7F0' text-anchor='middle'>UI</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" />
  <style>
    [data-theme="pduf"] {
      --color-base-100: #FBF7F0;
      --color-base-200: #F1E8D7;
      --color-base-300: #E6D7BA;
      --color-base-content: #211C12;
      --color-primary: #CB1617;
      --color-primary-content: #FFFFFF;
      --color-secondary: #C6A669;
      --color-secondary-content: #211C12;
      --color-accent: #E8C328;
      --color-neutral: #464747;
      --color-neutral-content: #FBF7F0;
      --radius-box: 0.75rem;
      --border: 1.5px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }

    .proto-card {
      background: #FFFFFF;
      border: 1.5px solid #C6A669;
      border-radius: 0.75rem;
      transition: box-shadow 160ms ease, transform 160ms ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .proto-card:hover {
      box-shadow: 0 6px 24px #46474733;
      transform: translateY(-2px);
    }
    .proto-thumb {
      height: 160px;
      border-radius: 0.6rem 0.6rem 0 0;
      overflow: hidden;
      background: #F1E8D7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .proto-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #F1E8D7;
      color: #75633F;
      display: inline-block;
    }
    .back-link {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #75633F;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 120ms;
    }
    .back-link:hover { color: #CB1617; }
  </style>
</head>
<body class="bg-base-200 min-h-dvh">

  <div class="max-w-3xl mx-auto px-5 py-10">

    <!-- Header -->
    <div class="mb-8">
      <a href="../index.html" class="back-link mb-5 block">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 4l-4 4 4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retour au quiz
      </a>
      <h1 class="font-serif text-3xl font-black tracking-tight text-base-content leading-tight">Prototypes</h1>
      <p class="text-base-content/50 text-sm mt-1">Explorations UI interactives — améliorations de pages existantes</p>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

      <!-- Restaurants -->
      <a href="restaurants.html" class="proto-card">
        <div class="proto-thumb">
          <!-- Thumb illustration -->
          <svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="48" height="64" rx="6" fill="#FBF7F0" stroke="#C6A669" stroke-width="1.5"/>
            <rect x="64" y="8" width="48" height="64" rx="6" fill="#FBF7F0" stroke="#C6A669" stroke-width="1.5"/>
            <rect x="16" y="18" width="32" height="18" rx="3" fill="#E6D7BA"/>
            <rect x="16" y="42" width="20" height="4" rx="2" fill="#C6A669"/>
            <rect x="16" y="50" width="28" height="3" rx="1.5" fill="#E6D7BA"/>
            <rect x="16" y="56" width="22" height="3" rx="1.5" fill="#E6D7BA"/>
            <rect x="72" y="18" width="32" height="18" rx="3" fill="#CB1617" fill-opacity="0.12"/>
            <rect x="72" y="42" width="20" height="4" rx="2" fill="#CB1617"/>
            <rect x="72" y="50" width="28" height="3" rx="1.5" fill="#E6D7BA"/>
            <rect x="72" y="56" width="22" height="3" rx="1.5" fill="#E6D7BA"/>
          </svg>
        </div>
        <div class="p-4 flex flex-col gap-2 flex-1">
          <div class="flex items-start justify-between gap-2">
            <p class="font-semibold text-sm text-base-content leading-snug">Réservation restaurants</p>
            <span class="proto-tag flex-shrink-0">Booking</span>
          </div>
          <p class="text-xs text-base-content/50 leading-relaxed">
            Refonte de la page restaurant de reservation.puydufou.com — sélection de menu, horaire et résumé de commande.
          </p>
          <p class="text-xs text-primary font-semibold mt-auto pt-2">Voir le prototype →</p>
        </div>
      </a>

      <!-- Placeholder slot -->
      <div class="proto-card opacity-40 cursor-default pointer-events-none">
        <div class="proto-thumb">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#C6A669" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M20 12v16M12 20h16" stroke="#C6A669" stroke-width="1.75" stroke-linecap="round"/></svg>
        </div>
        <div class="p-4">
          <p class="font-semibold text-sm text-base-content/40">Prochain prototype</p>
          <p class="text-xs text-base-content/30 mt-1">À venir</p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
